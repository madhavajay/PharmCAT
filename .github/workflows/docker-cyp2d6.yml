name: Build CYP2D6-enabled Docker image

# Builds a PharmCAT image with CYP2D6 calling + full report enabled by default
# (PHARMCAT_CYP2D6=1 baked in via build-arg) and pushes it to GitHub Container
# Registry under this repo's owner. Runtime `-e PHARMCAT_CYP2D6=0` can still
# override it back to stock behaviour.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/enable-cyp2d6-toggle

jobs:
  build:
    name: Build & push cyp2d6-enabled image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Package app
        run: |
          ./gradlew shadowJar --no-daemon
          mv build/libs/pharmcat-*-all.jar build/pharmcat.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pharmcat" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is cross-built under QEMU and is slow (compiles htslib/bcftools/
          # samtools from source). Drop to `linux/amd64` if CI times out.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHARMCAT_CYP2D6=1
          tags: |
            ${{ steps.img.outputs.name }}:cyp2d6-enabled
            ${{ steps.img.outputs.name }}:cyp2d6-enabled-${{ github.sha }}
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_MAX_PARALLELISM: 1
